name: WakeMe Transit Data Pipeline

on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Force refresh from live Overpass API (bypass local cache)'
        required: false
        default: 'true'
        type: boolean
  schedule:
    # Run automatically at 03:00 UTC on the 1st of every month
    - cron: '0 3 1 * *'

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python -m pytest tests/ -v

      - name: Execute Transit Data Pipeline
        run: |
          python -m src.main --force-refresh

      - name: Upload Verified Data Pack Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wakeme-bengaluru-datapack
          path: |
            data/processed/
            reports/
          retention-days: 90
