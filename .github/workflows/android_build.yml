name: StopNudge Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Compile & Run Unit Tests
        run: |
          ./gradlew testDebugUnitTest --stacktrace > test_run.log 2>&1 || {
            echo "==================== TEST FAILURE LOG ===================="
            tail -n 100 test_run.log
            echo "=========================================================="
            exit 1
          }

      - name: Assemble Debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace > assemble_run.log 2>&1 || {
            echo "=================== ASSEMBLE FAILURE LOG ================="
            tail -n 100 assemble_run.log
            echo "=========================================================="
            exit 1
          }

      - name: List Generated APKs
        run: find . -name "*.apk" -ls

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stopnudge-debug-apk
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14
