name: WakeMe Android Build

on:
  push:
    branches: [ v2 ]
  pull_request:
    branches: [ v2 ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WakeMe Debug APK & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Check for Hardcoded Secrets
        run: |
          if grep -rnE "AIza[0-9A-Za-z_-]{35}|ghp_[0-9A-Za-z]{36}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC )?PRIVATE KEY-----" wakeme/ src/; then
            echo "Potential hardcoded secret detected!"
            exit 1
          fi

      - name: Compile & Run Unit Tests
        run: ./gradlew :wakeme:testDebugUnitTest --stacktrace

      - name: Assemble WakeMe Debug APK
        run: ./gradlew :wakeme:assembleDebug --stacktrace

      - name: List Generated APK
        run: ls -lh wakeme/build/outputs/apk/debug/wakeme-debug.apk

      - name: Upload WakeMe Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wakeme-debug-apk
          path: wakeme/build/outputs/apk/debug/wakeme-debug.apk
          retention-days: 14
