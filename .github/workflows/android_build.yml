name: StopNudge Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: |
          ./gradlew testDebugUnitTest --stacktrace --info 2>&1 | tee test_build.log

      - name: Assemble Debug APK
        if: success()
        run: |
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tee assemble_build.log

      - name: Dump Log Tail on Failure
        if: failure()
        run: |
          echo "=== TAIL OF BUILD LOG ==="
          tail -n 150 test_build.log 2>/dev/null || true
          tail -n 150 assemble_build.log 2>/dev/null || true

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            test_build.log
            assemble_build.log
            app/build/reports/
          retention-days: 7

      - name: List Generated APKs
        run: |
          find app/build/outputs/ -type f -name "*.apk" -ls || true

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stopnudge-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
