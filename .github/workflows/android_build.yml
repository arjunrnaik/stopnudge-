name: WakeMe Android Build

on:
  push:
    branches: [ v2, ui-preview ]
  pull_request:
    branches: [ v2, ui-preview ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WakeMe Debug APK & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Check for Hardcoded Secrets
        run: |
          if grep -rnE "AIza[0-9A-Za-z_-]{35}|ghp_[0-9A-Za-z]{36}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC )?PRIVATE KEY-----" wakeme/ src/; then
            echo "Potential hardcoded secret detected!"
            exit 1
          fi

      - name: Compile & Run Unit Tests
        if: github.ref_name != 'ui-preview'
        run: ./gradlew :wakeme:testDebugUnitTest --stacktrace

      - name: Assemble WakeMe Debug APK
        if: github.ref_name != 'ui-preview'
        run: ./gradlew :wakeme:assembleDebug --stacktrace

      - name: Assemble WakeMe UI Lab APK
        if: github.ref_name == 'ui-preview'
        run: ./gradlew :ui_preview:assembleDebug --stacktrace

      - name: List Generated APK
        run: |
          if [ "${{ github.ref_name }}" = "ui-preview" ]; then
            ls -lh ui_preview/build/outputs/apk/debug/ui_preview-debug.apk
          else
            ls -lh wakeme/build/outputs/apk/debug/wakeme-debug.apk
          fi

      - name: Upload WakeMe Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'ui-preview' && 'ui-preview-debug-apk' || 'wakeme-debug-apk' }}
          path: ${{ github.ref_name == 'ui-preview' && 'ui_preview/build/outputs/apk/debug/ui_preview-debug.apk' || 'wakeme/build/outputs/apk/debug/wakeme-debug.apk' }}
          retention-days: 14
